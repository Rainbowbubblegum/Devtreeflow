<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTreeFlow Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-header">
        <h1>🌳 DevTreeFlow Dashboard</h1>
        <button class="refresh-btn-top" id="refreshBtnTop">
            Refresh
        </button>
    </div>
    <div class="section">
        <div class="section-header">Modes</div>
        <div class="modes-row">
            <button class="btn" id="autoPromptToggle">
                <span class="icon">🤖</span><span id="autoPromptText">Enable Auto-Prompting</span>
            </button>
            <label><input type="checkbox" id="copyToPromptBuilderToggle"> Copy to Prompt Builder before prompting</label>
        </div>
    </div>
    <div class="section">
        <div class="section-header">Chat Controls</div>
        <div class="chat-controls-row">
            <button class="btn secondary" id="newChatBtn">
                <span class="icon">💬</span>New Chat
            </button>
            <button class="btn secondary" id="newChatTabBtn">
                <span class="icon">💡</span>Open New Chat Tab
            </button>
            <button class="btn secondary" id="clearChatBtn">
                <span class="icon">🧹</span>Clear Chat
            </button>
        </div>
    </div>
    <div class="section">
        <div class="section-header">Tree Controls</div>
        <div class="tree-controls-row">
            <button class="btn" id="newTaskTreeBtn">
                <span class="icon">🌳</span>New Task Tree
            </button>
        </div>
    </div>
    
    <!-- Tree Section - Full Width -->
    <div class="section tree-section">
        <div class="section-header">Task Trees</div>
        <div id="treeContainer">
            <div class="empty-state">
                <h2>No DevTreeFlow Structure Found</h2>
                <p>Initialize DevTreeFlow to start managing your AI development workflows.</p>
                <button class="btn" id="initializeDevTreeFlowBtn">
                    <span class="icon">🚀</span>Initialize DevTreeFlow
                </button>
            </div>
        </div>
    </div>
    
    <!-- Context and Prompt Builder Section - Responsive Layout -->
    <div class="section context-and-prompt-section">
        <div class="context-prompt-container">
            <div id="contextFilesContainer" class="context-panel">
                <h3>📄 Project Specific Context Files</h3>
                <div class="context-files-list">
                    <p style="color: var(--vscode-descriptionForeground);">Loading context files...</p>
                </div>
            </div>
            <div id="promptBuilderContainer" class="prompt-panel">
                <div class="prompt-builder-header">
                    <h3>🛠️ Prompt Builder</h3>
                    <div class="prompt-builder-controls">
                        <button class="btn secondary small" id="clearPromptBtn" title="Clear all content">
                            <span class="icon">🗑️</span>Clear
                        </button>
                        <button class="btn secondary small" id="copyPromptBtn" title="Copy to clipboard">
                            <span class="icon">📋</span>Copy
                        </button>
                        <button class="btn secondary small" id="savePromptBtn" title="Save to file">
                            <span class="icon">💾</span>Save
                        </button>
                    </div>
                </div>
                <div class="prompt-builder-toolbar">
                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="insertHeadingBtn" title="Insert Heading">
                            <span class="icon">📝</span>H1
                        </button>
                        <button class="toolbar-btn" id="insertCodeBlockBtn" title="Insert Code Block">
                            <span class="icon">💻</span>Code
                        </button>
                        <button class="toolbar-btn" id="insertListBtn" title="Insert List">
                            <span class="icon">📋</span>List
                        </button>
                        <button class="toolbar-btn" id="insertLinkBtn" title="Insert Link">
                            <span class="icon">🔗</span>Link
                        </button>
                    </div>
                    <div class="toolbar-group">
                        <button class="toolbar-btn" id="togglePreviewBtn" title="Toggle Preview">
                            <span class="icon">👁️</span>Preview
                        </button>
                        <button class="toolbar-btn" id="expandTextareaBtn" title="Expand/Collapse">
                            <span class="icon">⛶</span>Expand
                        </button>
                    </div>
                </div>
                <div class="prompt-builder-content">
                    <textarea id="promptBuilderTextarea" rows="10" placeholder="Tree/leaf prompts will appear here when you use tree actions with 'Copy to Prompt Builder' mode enabled...

Tips for better prompts:
• Use clear headings with # 
• Structure with bullet points
• Include code blocks with ```
• Add context and examples"></textarea>
                    <div id="promptPreview" class="prompt-preview hidden"></div>
                </div>
                <div class="prompt-builder-actions">
                    <div class="character-count">
                        <span id="characterCount">0</span> characters
                    </div>
                    <button class="btn" id="autoPromptFromBuilderBtn">
                        <span class="icon">🚀</span>Auto-Prompt from Builder
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
